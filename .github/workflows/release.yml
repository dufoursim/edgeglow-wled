name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g icuewidget-cli
      - run: icuewidget package widget
      - run: mv *.icuewidget "EdgeGlow-${{ github.event.release.tag_name }}.icuewidget"
      - run: gh release upload "${{ github.event.release.tag_name }}" EdgeGlow-*.icuewidget
        env:
          GH_TOKEN: ${{ github.token }}
